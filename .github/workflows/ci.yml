name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # ==========================================
  # TypeScript Type Checking
  # ==========================================
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/learning_platform_test?schema=public
      JWT_SECRET: test-secret-key-for-ci
      VIDEO_TOKEN_SECRET: test-video-secret
      VIDEO_WATERMARK_HMAC_SECRET: test-watermark-secret
      STORAGE_SIGNING_SECRET: test-storage-secret
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: learning_platform_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client (API)
        run: pnpm --filter api exec prisma generate
      - name: TypeCheck API
        run: pnpm --filter api run build
      - name: TypeCheck Web
        run: pnpm --filter web run build

  # ==========================================
  # Linting
  # ==========================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  # ==========================================
  # Unit Tests
  # ==========================================
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/learning_platform_test?schema=public
      JWT_SECRET: test-secret-key-for-ci
      VIDEO_TOKEN_SECRET: test-video-secret
      VIDEO_WATERMARK_HMAC_SECRET: test-watermark-secret
      STORAGE_SIGNING_SECRET: test-storage-secret
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: learning_platform_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client (API)
        run: pnpm --filter api exec prisma generate
      - name: Run Unit Tests (API)
        run: pnpm --filter api test
      - name: Run Unit Tests (Web)
        run: pnpm --filter web test

  # ==========================================
  # Build Verification
  # ==========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test-unit]
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate
      - name: Build API
        run: pnpm --filter api run build
      - name: Build Web
        run: pnpm --filter web run build

  # ==========================================
  # E2E Tests (requires database - runs on PRs to main)
  # ==========================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/learning_platform_test?schema=public
      JWT_SECRET: test-secret-key-for-ci
      VIDEO_TOKEN_SECRET: test-video-secret
      VIDEO_WATERMARK_HMAC_SECRET: test-watermark-secret
      STORAGE_SIGNING_SECRET: test-storage-secret
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: learning_platform_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate
      - name: Run Migrations
        run: pnpm --filter api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/learning_platform_test?schema=public
      - name: Run E2E Tests
        run: pnpm --filter api test --config ./test/jest-e2e.json
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/learning_platform_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-for-ci
          VIDEO_TOKEN_SECRET: test-video-secret
          VIDEO_WATERMARK_HMAC_SECRET: test-watermark-secret
          STORAGE_SIGNING_SECRET: test-storage-secret
          NODE_ENV: test

  # ==========================================
  # Deployment Preview (for PRs)
  # ==========================================
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Web
        run: pnpm --filter web run build
      # Uncomment and configure when Vercel/Netlify is set up:
      # - name: Deploy to Preview
      #   uses: amondnet/vercel-action@v25
      #   with:
      #     vercel-token: ${{ secrets.VERCEL_TOKEN }}
      #     vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
      #     vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
      #     vercel-args: '--prod=false'
      #     working-directory: ./apps/web

  # ==========================================
  # Release (on main branch push)
  # ==========================================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          body: |
            Automated release from CI pipeline.
            - Build: ✅
            - Tests: ✅
            - E2E: ✅
          draft: false
          prerelease: false